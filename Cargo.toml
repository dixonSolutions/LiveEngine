[package]
name = "liveengine"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Rust live matchmaking, embedded and standalone hub hosting, and authenticated remote hub registries"
license = "MIT"
repository = "https://github.com/dixonSolutions/LiveEngine"
homepage = "https://github.com/dixonSolutions/LiveEngine"
readme = "README.md"
keywords = ["matchmaking", "hub", "registry", "hosting", "network"]
categories = ["network-programming", "game-development"]
include = ["src/**/*.rs", "tests/*.rs", "Cargo.toml", "Cargo.lock", "build.rs", "README.md", "LICENSE", "examples/*.rs", "docs/hub-contract.schema.json", "docs/*.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "liveengine-hub"
path = "src/bin/liveengine-hub.rs"
required-features = ["host"]

[features]
default = ["host"]
host = ["dep:axum", "dep:tokio", "dep:reqwest", "dep:url", "dep:futures-util", "dep:subtle", "dep:tower"]
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
axum = { version = "0.8", optional = true, features = ["json", "http1", "tokio"] }
tokio = { version = "1", optional = true, features = ["full"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
url = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }
subtle = { version = "2", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
napi = { version = "2", optional = true, default-features = false, features = ["napi6", "serde-json", "dyn-symbols"] }
napi-derive = { version = "2", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"

[[example]]
name = "custom-hub"
path = "examples/custom-hub.rs"
required-features = ["host"]
