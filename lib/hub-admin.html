<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hub administration</title><style>body{font:1rem/1.5 system-ui,sans-serif;max-width:70rem;margin:2rem auto;padding:0 1rem;color:#222}label{display:block;margin:.6rem 0}input,select,button{font:inherit;padding:.35rem}button{cursor:pointer}table{border-collapse:collapse;width:100%;margin:1rem 0}th,td{text-align:left;border-bottom:1px solid #999;padding:.5rem}#message{min-height:1.5em}section{margin:2rem 0} .scroll{overflow:auto}</style></head><body>
<h1>Hub administration</h1><p id="message" role="status" aria-live="polite"></p>
<section><h2>Create account</h2><form id="create"><label>Username <input name="username" required minlength="3" maxlength="64" autocomplete="username"></label><label>Password <input name="password" type="password" required minlength="10" autocomplete="new-password"></label><label>Role <select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label><button>Create account</button></form></section>
<section><h2>Accounts</h2><button id="refresh-accounts">Refresh accounts</button><div class="scroll"><table><thead><tr><th scope="col">Username</th><th scope="col">Enabled</th><th scope="col">Role</th><th scope="col">Actions</th></tr></thead><tbody id="accounts"></tbody></table></div></section>
<section><h2>Connections</h2><button id="refresh-connections">Refresh connections</button><div class="scroll"><table><thead><tr><th scope="col">User</th><th scope="col">Hub</th><th scope="col">Room</th><th scope="col">Action</th></tr></thead><tbody id="connections"></tbody></table></div></section>
<script>
const message=document.querySelector('#message'), base=location.pathname.replace(/\/$/,'');
async function api(path,method='GET',body){const r=await fetch(base+'/'+path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function notice(error){message.textContent=error instanceof Error?error.message:error}
function cell(row,text){const td=row.insertCell();td.textContent=text;return td}
function button(text,action){const b=document.createElement('button');b.type='button';b.textContent=text;b.addEventListener('click',()=>Promise.resolve().then(action).catch(notice));return b}
async function accounts(){const rows=await api('accounts'), body=document.querySelector('#accounts');body.replaceChildren();for(const a of rows){const row=body.insertRow();cell(row,a.username);cell(row,a.enabled?'Yes':'No');cell(row,a.role);const actions=cell(row,'');actions.append(button(a.enabled?'Disable':'Enable',async()=>{await api('accounts/'+encodeURIComponent(a.username),'PATCH',{enabled:!a.enabled});await accounts();notice('Account updated')}));const role=document.createElement('select');role.setAttribute('aria-label','Role for '+a.username);for(const r of ['user','admin']){const option=document.createElement('option');option.value=r;option.textContent=r;role.append(option)}role.value=a.role;actions.append(' ',role,' ',button('Change role',async()=>{await api('accounts/'+encodeURIComponent(a.username),'PATCH',{role:role.value});await accounts();notice('Role updated')}));const password=document.createElement('input');password.type='password';password.autocomplete='new-password';password.setAttribute('aria-label','New password for '+a.username);actions.append(' ',password,' ',button('Reset password',async()=>{await api('accounts/'+encodeURIComponent(a.username),'PATCH',{password:password.value});password.value='';notice('Password reset')}))}}
async function connections(){const rows=await api('connections'), body=document.querySelector('#connections');body.replaceChildren();for(const c of rows){const row=body.insertRow();cell(row,c.user);cell(row,Array.isArray(c.hub)?c.hub.join('/'):c.hub);cell(row,c.room);cell(row,'').append(button('Kick '+c.user,async()=>{await api('connections/'+encodeURIComponent(c.id),'DELETE');await connections();notice('Connection kicked')}))}}
document.querySelector('#create').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;try{await api('accounts','POST',Object.fromEntries(new FormData(form)));form.reset();await accounts();notice('Account created')}catch(error){notice(error)}});document.querySelector('#refresh-accounts').onclick=()=>accounts().catch(notice);document.querySelector('#refresh-connections').onclick=()=>connections().catch(notice);accounts().catch(notice);connections().catch(notice);
</script></body></html>
